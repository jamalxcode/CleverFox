name: Deploy site
on:
  push: { branches: [main] }
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate seed records and build the catalog
        run: npm test && npm run build
      - name: Assemble the public site
        # Only public files: data/seed/ keeps internal research notes and is never published.
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js CNAME .nojekyll _site/
          cp data/catalog.json _site/data/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
