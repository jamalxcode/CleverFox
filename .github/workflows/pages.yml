name: Import and deploy
# On push: build and deploy what's committed.
# Three times a day (cron-job.org, with GitHub's schedule as backup): scan X for announcements, fill in new
# models and datasets from Hugging Face, build and deploy. The first run in 20 hours is a full refresh
# (Hugging Face, Ollama, benchmarks, providers, App Store, re-check); tools/mode.mjs decides. Imported files
# live on the `data` branch, overwritten as a single commit. A failed or shrunken import keeps the previous files.
on:
  push: { branches: [main] }
  # Timer: cron-job.org starts this 3 times a day (03:41, 11:41, 19:41 UTC) through GitHub's API, as Flattery does:
  # POST https://api.github.com/repos/jamalxcode/CleverFox/actions/workflows/pages.yml/dispatches, body {"ref":"main"}.
  # GitHub's schedule below is a late backup; a run that comes too soon after another reads nothing from X.
  schedule: [{ cron: '7 5,13,21 * * *' }]
  workflow_dispatch:
    inputs:
      mode: { description: 'auto (full refresh if the last was 20+ hours ago, else a quick X scan), full or x', type: choice, options: [auto, full, x], default: auto }
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Restore the last imports from the data branch
        run: |
          mkdir -p data/imported
          if git fetch --depth 1 origin data 2>/dev/null; then git archive FETCH_HEAD imported | tar -x -C data; ls -la data/imported; else echo "No data branch yet."; fi
      - name: Decide what this run does (full refresh, quick X scan, or just deploy)
        id: mode
        run: node tools/mode.mjs "${{ github.event_name }}" "${{ inputs.mode || 'auto' }}"
      - name: Scan X for announcements and what people say (skipped without X_BEARER_TOKEN)
        if: steps.mode.outputs.mode != 'none'
        env: { X_BEARER_TOKEN: "${{ secrets.X_BEARER_TOKEN }}", X_MONTHLY_READS: "${{ vars.X_MONTHLY_READS }}" }
        run: node tools/x.mjs
      - name: Discover - Hugging Face, llm-releases.com, GitHub, YouTube, Replicate, OpenRouter, makers' news, papers, Hacker News, App Store, Product Hunt
        if: steps.mode.outputs.mode != 'none'
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", GH_TOKEN: "${{ github.token }}", YOUTUBE_API_KEY: "${{ secrets.YOUTUBE_API_KEY }}", REPLICATE_API_TOKEN: "${{ secrets.REPLICATE_API_TOKEN }}", PRODUCT_HUNT_TOKEN: "${{ secrets.PRODUCT_HUNT_TOKEN }}" }
        run: node tools/discover.mjs
      - name: Quick scan - fill in models and datasets announced on X or newly released
        if: steps.mode.outputs.mode == 'x'
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}" }
        run: node tools/import.mjs --x-only && node tools/providers.mjs && node tools/autoresearch.mjs
      - name: Full refresh - import from Hugging Face and the Ollama library, benchmarks, providers, App Store, re-check
        if: steps.mode.outputs.mode == 'full'
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", AA_API_KEY: "${{ secrets.AA_API_KEY }}" }
        run: node tools/import.mjs && node tools/benchmarks.mjs && node tools/providers.mjs && node tools/autoresearch.mjs && node tools/appstore.mjs && node tools/recheck.mjs
      - name: Validate and build the catalog
        run: npm test && npm run build && node tools/health.mjs
      - name: Page check - phone widths and colour contrast (stops the deploy on a problem)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.49.1 axe-core@4.10.2
          npx playwright install --with-deps chromium
          node tools/ui-check.cjs --root .
      - name: Save imports to the data branch (one commit, overwritten)
        if: steps.mode.outputs.mode != 'none'
        run: bash tools/save-data.sh "Imported data"
      - name: Assemble the public site
        # Only public files: data/seed/ keeps internal research notes and is never published.
        run: |
          mkdir -p _site/data
          cp index.html style.css app.js render.js picks.js i18n.js you.js .nojekyll sitemap.xml robots.txt _site/
          cp -r l new guides glossary feeds status _site/ && cp feed.xml _site/
          cp -r img _site/ && rm -rf _site/img/source
          cp data/*.json _site/data/
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" _site/index.html _site/app.js _site/picks.js _site/glossary/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
      # After the deploy, so a failed post never holds back the catalog. The "already posted" flag is saved in the same step.
      - name: Weekly post on X (off unless the X_POST_ENABLED variable is true)
        if: steps.mode.outputs.mode == 'full'
        continue-on-error: true
        env: { X_POST_ENABLED: "${{ vars.X_POST_ENABLED }}", X_API_KEY: "${{ secrets.X_API_KEY }}", X_API_SECRET: "${{ secrets.X_API_SECRET }}", X_ACCESS_TOKEN: "${{ secrets.X_ACCESS_TOKEN }}", X_ACCESS_SECRET: "${{ secrets.X_ACCESS_SECRET }}" }
        run: node tools/xpost.mjs && if [ -f data/imported/xpost-state.json ] && [ data/imported/xpost-state.json -nt data/imported/x.json ]; then bash tools/save-data.sh "Weekly X post"; fi
